apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openemr-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tomwakhungu/Hello-openemr.git
    targetRevision: HEAD
    path: manifests/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: openemr-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
